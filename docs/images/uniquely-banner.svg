<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc"><title id="title">Uniquely Liberu Laravel SaaS Foundation</title><desc id="desc">A violet and rose modular SaaS banner showing host composition, modules, themes, tenancy, and cross-package tests with upstream attribution.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#211d35"/><stop offset="1" stop-color="#754d85"/></linearGradient><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#fff" stroke-opacity=".07"/></pattern><style>.t{font:700 42px Segoe UI,Arial;fill:#fff8ff}.s{font:600 15px Segoe UI,Arial;letter-spacing:2px;fill:#f0ddf3}.e{font:700 12px Segoe UI,Arial;letter-spacing:2.3px;fill:#f4b1d1}.l{font:700 12px Segoe UI,Arial;fill:#fff}.q{font:400 11px Segoe UI,Arial;fill:#ddc9e2}</style></defs><rect width="1200" height="360" rx="22" fill="url(#bg)"/><rect width="1200" height="360" rx="22" fill="url(#grid)"/><circle cx="1090" cy="35" r="220" fill="#f4b1d1" opacity=".12"/><text x="70" y="66" class="e">UNIQUELY � LIBERU � MODULAR SAAS FOUNDATION</text><text x="70" y="125" class="t">Uniquely</text><text x="72" y="160" class="s">HOST    MODULES  +  THEMES    TENANCY    TESTED COMPOSITION</text><path d="M110 245H1090" stroke="#a36ba8" stroke-width="2"/><path d="M144 245H1050" stroke="#f4b1d1" stroke-width="3"/><g><circle cx="144" cy="245" r="24" fill="#543d6e" stroke="#f4b1d1" stroke-width="2"/><text x="144" y="250" text-anchor="middle" class="l">01</text><text x="144" y="292" text-anchor="middle" class="l">Host</text><text x="144" y="312" text-anchor="middle" class="q">app + config</text><circle cx="383" cy="245" r="24" fill="#543d6e" stroke="#f4b1d1" stroke-width="2"/><text x="383" y="250" text-anchor="middle" class="l">02</text><text x="383" y="292" text-anchor="middle" class="l">Modules</text><text x="383" y="312" text-anchor="middle" class="q">Composer releases</text><circle cx="622" cy="245" r="24" fill="#543d6e" stroke="#f4b1d1" stroke-width="2"/><text x="622" y="250" text-anchor="middle" class="l">03</text><text x="622" y="292" text-anchor="middle" class="l">Themes</text><text x="622" y="312" text-anchor="middle" class="q">inheritance + fallback</text><circle cx="861" cy="245" r="24" fill="#543d6e" stroke="#f4b1d1" stroke-width="2"/><text x="861" y="250" text-anchor="middle" class="l">04</text><text x="861" y="292" text-anchor="middle" class="l">Tenancy</text><text x="861" y="312" text-anchor="middle" class="q">panels + permissions</text><circle cx="1050" cy="245" r="24" fill="#38504e" stroke="#a8e8d7" stroke-width="2"/><text x="1050" y="250" text-anchor="middle" class="l">05</text><text x="1050" y="292" text-anchor="middle" class="l">Tests</text><text x="1050" y="312" text-anchor="middle" class="q">boundaries + tooling</text></g><text x="70" y="342" class="q">Liberu project identity and upstream attribution remain visible</text></svg>

