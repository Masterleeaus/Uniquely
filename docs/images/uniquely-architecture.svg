<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="760" viewBox="0 0 1500 760" role="img" aria-labelledby="title desc"><title id="title">Uniquely Liberu Laravel SaaS Foundation architecture</title><desc id="desc">A Liberu reference host composes Laravel application and configuration with independently released modules and themes, tenant-aware panels, and cross-package tests.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#211d35"/><stop offset="1" stop-color="#754d85"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="#f4b1d1"/></marker><style>.e{font:700 13px Segoe UI,Arial;letter-spacing:2px;fill:#f4b1d1}.t{font:700 32px Segoe UI,Arial;fill:#fff8ff}.s{font:400 15px Segoe UI,Arial;fill:#f0ddf3}.n{fill:#4a3567;stroke:#a36ba8;stroke-width:2}.g{fill:#754d85;stroke:#f4b1d1;stroke-width:2}.y{fill:#38504e;stroke:#a8e8d7;stroke-width:2}.l{font:700 16px Segoe UI,Arial;fill:#fff}.b{font:400 13px Segoe UI,Arial;fill:#eedcf0}.q{font:400 12px Segoe UI,Arial;fill:#d8c4df}.r{stroke:#f4b1d1;stroke-width:3;fill:none;marker-end:url(#a)}</style></defs><rect width="1500" height="760" rx="26" fill="url(#bg)"/><text x="64" y="58" class="e">UNIQUELY � LIBERU COMPOSITION MAP</text><text x="64" y="106" class="t">A reference host assembled from independent PHP packages</text><text x="64" y="136" class="s">Source-backed from app/, config/, modules/, themes/, composer.json, and tests/.</text><rect x="70" y="220" width="250" height="130" rx="16" class="n"/><text x="195" y="260" text-anchor="middle" class="l">Host application</text><text x="195" y="290" text-anchor="middle" class="b">boot � config � routes</text><text x="195" y="318" text-anchor="middle" class="q">Laravel 13 + panels</text><path d="M320 285H430" class="r"/><rect x="430" y="220" width="250" height="130" rx="16" class="g"/><text x="555" y="260" text-anchor="middle" class="l">Composer modules</text><text x="555" y="290" text-anchor="middle" class="b">capabilities + providers</text><text x="555" y="318" text-anchor="middle" class="q">independent releases</text><path d="M680 285H790" class="r"/><rect x="790" y="220" width="250" height="130" rx="16" class="g"/><text x="915" y="260" text-anchor="middle" class="l">Themes</text><text x="915" y="290" text-anchor="middle" class="b">inheritance + fallback</text><text x="915" y="318" text-anchor="middle" class="q">visual packages</text><path d="M1040 285H1150" class="r"/><rect x="1150" y="220" width="280" height="130" rx="16" class="y"/><text x="1290" y="260" text-anchor="middle" class="l">Tenancy + tests</text><text x="1290" y="290" text-anchor="middle" class="b">panels � permissions</text><text x="1290" y="318" text-anchor="middle" class="q">boundary + tooling checks</text><rect x="500" y="520" width="650" height="92" rx="16" class="n"/><text x="825" y="557" text-anchor="middle" class="l">Liberu upstream boundary</text><text x="825" y="584" text-anchor="middle" class="q">preserve package identity, version truth, and attribution</text></svg>

